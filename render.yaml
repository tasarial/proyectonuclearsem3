services:
  - type: web
    name: ergoplus
    runtime: python
    plan: starter            # el plan gratuito borra las fotos en cada reinicio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT --timeout 60 app:app
    healthCheckPath: /login
    disk:
      name: ergoplus-fotos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BEHIND_PROXY
        value: "1"
      - key: HTTPS
        value: "1"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SECRET_KEY
        generateValue: true
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        sync: false
      - key: MYSQL_SSL
        value: "1"
      - key: OWNER_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
