{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block auth_content %}
<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <img class="logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt="ERGOPLUS">
      <h1>ERGOPLUS</h1>
      <p>Evaluación ergonómica y estudio de métodos</p>
    </div>

    <form class="login-body" id="loginForm">
      <div class="campo">
        <label>Usuario</label>
        <input type="text" name="username" id="username" autocomplete="username" placeholder="Tu usuario" required>
      </div>
      <div class="campo">
        <label>Contraseña</label>
        <div class="pwd-wrap">
          <input type="password" name="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="pwd-eye" data-target="password" title="Ver/ocultar" aria-label="Ver u ocultar contraseña">👁</button>
        </div>
      </div>
      <button type="submit" class="btn" id="btnLogin">Entrar</button>
    </form>

    <div class="login-footer">
      Sistema de evaluación ergonómica y estudio de métodos
    </div>
  </div>
</div>

<script>
(function () {
  var form = document.getElementById('loginForm');
  var btn = document.getElementById('btnLogin');
  var locked = false;
  var timer = null;

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (locked) return;

    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;

    if (!username || !password) {
      toast('Debes completar usuario y contraseña.', 'warning');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Verificando...';

    fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ username: username, password: password })
    })
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data.ok) {
        toast('Bienvenido', 'ok');
        setTimeout(function () { location.href = data.redirect; }, 400);
      } else {
        toast(data.msg || 'Error', data.type || 'error');
        if (data.lockout && data.lockout > 0) {
          startLockout(data.lockout);
        } else {
          btn.disabled = false;
          btn.textContent = 'Entrar';
        }
      }
    })
    .catch(function () {
      toast('Error de conexión. Intenta de nuevo.', 'error');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    });
  });

  function startLockout(seconds) {
    locked = true;
    var remaining = seconds;
    updateBtn(remaining);
    clearInterval(timer);
    timer = setInterval(function () {
      remaining--;
      if (remaining <= 0) {
        clearInterval(timer);
        locked = false;
        btn.disabled = false;
        btn.textContent = 'Entrar';
      } else {
        updateBtn(remaining);
      }
    }, 1000);
  }

  function updateBtn(secs) {
    var m = Math.floor(secs / 60);
    var s = secs % 60;
    btn.textContent = m > 0
      ? 'Bloqueado · ' + m + ':' + String(s).padStart(2, '0')
      : 'Bloqueado · ' + s + 's';
    btn.disabled = true;
  }
})();
</script>
{% endblock %}
