{% extends "base.html" %}
{% block title %}Clientes{% endblock %}
{% block page_title %}Clientes · Empresas, sedes, salones y puestos{% endblock %}

{% block content %}

<div class="cli-layout{% if not can('emp_edit') %} ro-edit{% endif %}{% if not can('emp_del') %} ro-del{% endif %}">
  <div class="cli-tree">
    <div class="cli-tree-head">
      <span>Estructura</span>
      <button type="button" class="btn btn-sm" id="btnNuevaEmpresa"{% if not can('emp_edit') %} hidden{% endif %}>+ Empresa</button>
    </div>
    <div class="cli-tree-body" id="treeBody"></div>
  </div>
  <div class="cli-panel" id="editPanel">
    <div class="cli-panel-empty" id="panelEmpty">Selecciona un elemento o crea uno nuevo</div>
    <div class="panel-card" id="panelForm" style="display:none">
      <h3>
        <span id="panelTitle">Nuevo</span>
        <button type="button" id="btnCerrarPanel" style="background:none;border:none;cursor:pointer;color:var(--suave);font-size:20px;line-height:1">&times;</button>
      </h3>
      <form id="crudForm">
        <div id="formFields"></div>
        <div class="panel-actions">
          <button type="submit" class="btn" id="btnSave">Guardar</button>
          <button type="button" class="btn-sec" id="btnCancelar">Cancelar</button>
          <button type="button" class="btn-sec btn-danger" id="btnDelete" style="display:none">Eliminar</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
  var empresasData = {{ empresas | tojson }};
  var estado = {};
  var actual = null;

  var treeBody = document.getElementById('treeBody');
  var panelEmpty = document.getElementById('panelEmpty');
  var panelForm = document.getElementById('panelForm');
  var formFields = document.getElementById('formFields');
  var panelTitle = document.getElementById('panelTitle');
  var btnSave = document.getElementById('btnSave');
  var btnDelete = document.getElementById('btnDelete');

  function esc(s) {
    if (s === null || s === undefined) return '';
    var d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
  }

  function iconSvg(t) {
    if (t === 'folder') return '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>';
    if (t === 'building') return '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>';
    if (t === 'home') return '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>';
    return '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>';
  }

  function renderTree() {
    if (!empresasData || empresasData.length === 0) {
      treeBody.innerHTML = '<div class="empty-state"><p>No hay empresas registradas.</p><button type="button" class="btn" id="btnPrimera">Crear primera empresa</button></div>';
      var bp = document.getElementById('btnPrimera');
      if (bp) bp.onclick = function () { abrirCrear('empresa'); };
      return;
    }

    var html = '';
    empresasData.forEach(function (emp) {
      var st = estado[emp.id] || { open: false, sedes: null };
      html += '<div class="t-item">';
      html += makeRow('empresa', emp.id, emp.nombre, st.open, emp.num_sedes, '#d97706', 'folder');
      html += '<div class="t-kids' + (st.open ? '' : ' hide') + '" data-kids="emp-' + emp.id + '">';
      if (st.sedes) {
        st.sedes.forEach(function (sedeWrap) {
          var sede = sedeWrap.data;
          html += '<div class="t-item">';
          html += makeRow('sede', sede.id, sede.nombre, sedeWrap.open, sede.num_salones, '#3b82f6', 'building');
          html += '<div class="t-kids' + (sedeWrap.open ? '' : ' hide') + '" data-kids="sede-' + sede.id + '">';
          if (sedeWrap.salones) {
            sedeWrap.salones.forEach(function (salonWrap) {
              var salon = salonWrap.data;
              html += '<div class="t-item">';
              html += makeRow('salon', salon.id, salon.nombre, salonWrap.open, salon.num_puestos, '#059669', 'home');
              html += '<div class="t-kids' + (salonWrap.open ? '' : ' hide') + '" data-kids="salon-' + salon.id + '">';
              if (salonWrap.puestos) {
                salonWrap.puestos.forEach(function (p) {
                  var pname = (p.numero_puesto ? p.numero_puesto + ' · ' : '') + p.nombre;
                  html += makeRow('puesto', p.id, pname, false, null, '#6b7280', 'user');
                });
              }
              html += '<button type="button" class="t-add" data-crear="puesto" data-parent="' + salon.id + '">+ Añadir puesto</button>';
              html += '</div></div>';
            });
          }
          html += '<button type="button" class="t-add" data-crear="salon" data-parent="' + sede.id + '">+ Añadir salón</button>';
          html += '</div></div>';
        });
      }
      html += '<button type="button" class="t-add" data-crear="sede" data-parent="' + emp.id + '">+ Añadir sede</button>';
      html += '</div></div>';
    });
    treeBody.innerHTML = html;
    bindTreeEvents();
  }

  function makeRow(tipo, id, nombre, open, count, color, icon) {
    var isOn = actual && actual.tipo === tipo && actual.id === id ? ' on' : '';
    var arrow = (tipo !== 'puesto')
      ? '<svg class="t-arrow' + (open ? ' open' : '') + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>'
      : '<span style="width:16px;display:inline-block"></span>';
    var countHtml = (count !== null && count !== undefined) ? '<span class="t-count">' + count + '</span>' : '';
    return '<div class="t-row' + isOn + '" data-tipo="' + tipo + '" data-id="' + id + '">' +
      arrow +
      '<svg class="t-icon" style="color:' + color + '" fill="none" stroke="currentColor" viewBox="0 0 24 24">' + iconSvg(icon) + '</svg>' +
      '<span class="t-name">' + esc(nombre) + '</span>' +
      countHtml +
      '<button type="button" class="t-btn" data-edit="' + tipo + '" data-id="' + id + '" title="Editar">✎</button>' +
      '</div>';
  }

  function bindTreeEvents() {
    treeBody.querySelectorAll('.t-row').forEach(function (row) {
      row.addEventListener('click', function (e) {
        if (e.target.closest('[data-edit]')) return;
        var tipo = row.getAttribute('data-tipo');
        var id = parseInt(row.getAttribute('data-id'), 10);
        clickRow(tipo, id);
      });
    });
    treeBody.querySelectorAll('[data-edit]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var tipo = btn.getAttribute('data-edit');
        var id = parseInt(btn.getAttribute('data-id'), 10);
        abrirEditar(tipo, id);
      });
    });
    treeBody.querySelectorAll('[data-crear]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var tipo = btn.getAttribute('data-crear');
        var parent = parseInt(btn.getAttribute('data-parent'), 10);
        abrirCrear(tipo, parent);
      });
    });
  }

  function getEmpresa(id) {
    for (var i = 0; i < empresasData.length; i++) {
      if (empresasData[i].id === id) return empresasData[i];
    }
    return null;
  }

  function findData(tipo, id) {
    if (tipo === 'empresa') return getEmpresa(id);
    for (var empId in estado) {
      var st = estado[empId];
      if (!st || !st.sedes) continue;
      for (var i = 0; i < st.sedes.length; i++) {
        var sw = st.sedes[i];
        if (tipo === 'sede' && sw.data.id === id) return sw.data;
        if (!sw.salones) continue;
        for (var j = 0; j < sw.salones.length; j++) {
          var aw = sw.salones[j];
          if (tipo === 'salon' && aw.data.id === id) return aw.data;
          if (tipo === 'puesto' && aw.puestos) {
            for (var k = 0; k < aw.puestos.length; k++) {
              if (aw.puestos[k].id === id) return aw.puestos[k];
            }
          }
        }
      }
    }
    return null;
  }

  async function clickRow(tipo, id) {
    actual = { tipo: tipo, id: id };
    if (tipo === 'empresa') {
      if (!estado[id]) estado[id] = { open: false, sedes: null };
      if (!estado[id].open) {
        if (!estado[id].sedes) {
          var r = await fetch('/api/empresa/' + id + '/sedes');
          var list = await r.json();
          estado[id].sedes = list.map(function (s) {
            return { open: false, data: s, salones: null };
          });
        }
        estado[id].open = true;
      } else {
        estado[id].open = false;
      }
    } else if (tipo === 'sede') {
      for (var empId in estado) {
        var st = estado[empId];
        if (!st || !st.sedes) continue;
        for (var i = 0; i < st.sedes.length; i++) {
          if (st.sedes[i].data.id === id) {
            var sw = st.sedes[i];
            if (!sw.open) {
              if (!sw.salones) {
                var r2 = await fetch('/api/sede/' + id + '/salones');
                var list2 = await r2.json();
                sw.salones = list2.map(function (s) {
                  return { open: false, data: s, puestos: null };
                });
              }
              sw.open = true;
            } else {
              sw.open = false;
            }
          }
        }
      }
    } else if (tipo === 'salon') {
      for (var empId2 in estado) {
        var st2 = estado[empId2];
        if (!st2 || !st2.sedes) continue;
        st2.sedes.forEach(function (sw) {
          if (!sw.salones) return;
          sw.salones.forEach(function (aw) {
            if (aw.data.id === id) {
              if (!aw.open) {
                if (!aw.puestos) {
                  fetch('/api/salon/' + id + '/puestos')
                    .then(function (r) { return r.json(); })
                    .then(function (list) {
                      aw.puestos = list;
                      aw.open = true;
                      renderTree();
                    });
                  return;
                }
                aw.open = true;
              } else {
                aw.open = false;
              }
            }
          });
        });
      }
    }
    renderTree();
  }

  var CAT = {{ CAT | tojson }};
  function opts(list, val, placeholder) {
    return '<option value="">' + (placeholder || '— Selecciona —') + '</option>' + list.map(function (o) {
      return '<option' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join('');
  }
  function inp(name, label, d, max, extra) {
    return '<div><label>' + label + '</label><input name="' + name + '" maxlength="' + max + '" value="' + esc(d[name]) + '"' + (extra || '') + '></div>';
  }
  function fieldsHtml(tipo, d) {
    d = d || {};
    var L = CAT.limites;
    if (tipo === 'empresa') {
      var tp = d.tipo_persona || 'Jurídica', td = d.tipo_documento || 'NIT';
      return '<div class="g2"><div><label>Tipo de persona *</label><select name="tipo_persona" id="fTP">' + opts(CAT.tipos_persona, tp, 'Selecciona') + '</select></div>' +
        '<div><label>Tipo de documento *</label><select name="tipo_documento" id="fTD">' + opts(CAT.tipos_documento, td, 'Selecciona') + '</select></div></div>' +
        '<div class="g2"><div><label id="lblDoc">Número de documento</label><input name="nit" id="fNit" maxlength="' + L.nit + '" value="' + esc(d.nit) + '" inputmode="text" autocomplete="off"><div class="muted" id="docAyuda" style="margin:-8px 0 10px"></div></div>' +
        '<div><label>Sector</label><select name="sector">' + opts(CAT.sectores, d.sector) + '</select></div></div>' +
        '<label>' + '<span id="lblNombre">Razón social / nombre</span> *</label><input name="nombre" required maxlength="' + L.nombre + '" value="' + esc(d.nombre) + '">' +
        '<div class="g2"><div><label>Departamento</label><select name="departamento">' + opts(CAT.departamentos, d.departamento) + '</select></div>' +
        inp('ciudad', 'Ciudad / municipio', d, L.ciudad) + '</div>' +
        '<label>Dirección</label><input name="direccion" maxlength="' + L.direccion + '" value="' + esc(d.direccion) + '">' +
        '<div class="g2"><div><label>Tamaño</label><select name="tamano">' + opts(CAT.tamanos, d.tamano) + '</select></div>' +
        '<div><label>Nº de trabajadores</label><input name="num_trabajadores" type="number" min="1" max="200000" value="' + esc(d.num_trabajadores) + '"></div></div>' +
        '<div class="g2"><div><label>ARL</label><select name="arl">' + opts(CAT.arls, d.arl) + '</select></div>' +
        inp('telefono', 'Teléfono', d, L.telefono, ' inputmode="tel" placeholder="604 555 1234"') + '</div>' +
        '<div class="g2"><div><label>Email</label><input name="email" type="email" maxlength="' + L.email + '" value="' + esc(d.email) + '"></div>' +
        inp('contacto', 'Persona de contacto', d, L.contacto) + '</div>' +
        inp('cargo_contacto', 'Cargo del contacto', d, L.cargo_contacto);
    }
    if (tipo === 'sede') {
      return '<label>Nombre *</label><input name="nombre" required maxlength="' + L.nombre + '" value="' + esc(d.nombre) + '">' +
        '<label>Dirección</label><input name="direccion" maxlength="' + L.direccion + '" value="' + esc(d.direccion) + '">' +
        '<div class="g2">' + inp('ciudad', 'Ciudad', d, L.ciudad) + inp('telefono', 'Teléfono', d, L.telefono, ' inputmode="tel"') + '</div>';
    }
    if (tipo === 'salon') {
      return '<label>Nombre *</label><input name="nombre" required maxlength="' + L.nombre + '" value="' + esc(d.nombre) + '">' +
        '<label>Descripción</label><input name="descripcion" maxlength="' + L.descripcion + '" value="' + esc(d.descripcion) + '">';
    }
    if (tipo === 'puesto') {
      return '<div class="g2">' + inp('numero_puesto', 'Nº puesto', d, L.numero_puesto, ' placeholder="P-01"') +
        '<div><label>Nombre *</label><input name="nombre" required maxlength="' + L.nombre + '" value="' + esc(d.nombre) + '"></div></div>' +
        '<div class="g2"><div><label>Área</label><input name="area" maxlength="' + L.area + '" list="dlAreas" value="' + esc(d.area) + '"><datalist id="dlAreas">' +
        CAT.areas_sugeridas.map(function (a) { return '<option value="' + esc(a) + '">'; }).join('') + '</datalist></div>' +
        inp('ubicacion', 'Ubicación', d, L.ubicacion) + '</div>' +
        '<label>Descripción</label><textarea name="descripcion" rows="2" maxlength="' + L.descripcion + '">' + esc(d.descripcion) + '</textarea>';
    }
    return '';
  }

  // Documento según tipo: etiqueta, ayuda y reglas de la jurídica (solo NIT)
  function ligarDocumento() {
    var tp = document.getElementById('fTP'), td = document.getElementById('fTD'), nit = document.getElementById('fNit');
    if (!tp || !td || !nit) return;
    function upd() {
      if (tp.value === 'Jurídica') { td.value = 'NIT'; }
      Array.prototype.forEach.call(td.options, function (o) { o.disabled = (tp.value === 'Jurídica' && o.value && o.value !== 'NIT'); });
      document.getElementById('lblDoc').textContent = 'Número de ' + (td.value || 'documento');
      document.getElementById('docAyuda').textContent = CAT.doc_ayuda[td.value] || '';
      nit.maxLength = td.value === 'NIT' ? 12 : 12;
      document.getElementById('lblNombre').textContent = tp.value === 'Natural' ? 'Nombre completo' : 'Razón social';
    }
    tp.onchange = upd; td.onchange = upd; upd();
  }

  function abrirCrear(tipo, parentId) {
    actual = { tipo: tipo, id: null, parentId: parentId, modo: 'crear' };
    var titles = { empresa: 'Nueva empresa', sede: 'Nueva sede', salon: 'Nuevo salón', puesto: 'Nuevo puesto' };
    panelTitle.textContent = titles[tipo] || 'Nuevo';
    btnSave.textContent = 'Crear';
    btnDelete.style.display = 'none';
    formFields.innerHTML = fieldsHtml(tipo, {});
    ligarDocumento(); attachCounters(formFields);
    panelEmpty.style.display = 'none';
    panelForm.style.display = 'block';
  }

  function abrirEditar(tipo, id) {
    var data = findData(tipo, id);
    if (!data && tipo === 'empresa') data = getEmpresa(id);
    if (!data) {
      toast('No se encontró el elemento. Expande el árbol primero.', 'warning');
      return;
    }
    actual = { tipo: tipo, id: id, data: data, modo: 'editar' };
    var titles = { empresa: 'Editar empresa', sede: 'Editar sede', salon: 'Editar salón', puesto: 'Editar puesto' };
    panelTitle.textContent = (titles[tipo] || 'Editar') + ' #' + id;
    btnSave.textContent = 'Guardar';
    btnDelete.style.display = 'inline-block';
    formFields.innerHTML = fieldsHtml(tipo, data);
    ligarDocumento(); attachCounters(formFields);
    panelEmpty.style.display = 'none';
    panelForm.style.display = 'block';
  }

  function cerrarPanel() {
    panelForm.style.display = 'none';
    panelEmpty.style.display = 'flex';
    actual = null;
  }

  function getFormData() {
    var form = document.getElementById('crudForm');
    var data = {};
    form.querySelectorAll('input, textarea, select').forEach(function (el) {
      if (el.name) data[el.name] = el.value;
    });
    return data;
  }

  async function guardar(e) {
    e.preventDefault();
    if (!actual) return;
    var data = getFormData();
    if (!data.nombre || !data.nombre.trim()) {
      toast('El nombre es obligatorio.', 'warning');
      return;
    }
    var tipo = actual.tipo;
    var url, method;
    if (actual.modo === 'crear') {
      method = 'POST';
      url = '/api/' + tipo;
      if (tipo === 'sede') data.empresa_id = actual.parentId;
      if (tipo === 'salon') data.sede_id = actual.parentId;
      if (tipo === 'puesto') data.salon_id = actual.parentId;
    } else {
      method = 'PUT';
      url = '/api/' + tipo + '/' + actual.id;
    }
    try {
      var res = await api(url, { method: method, body: data });
      if (res.ok) {
        toast(res.data.msg || 'Guardado correctamente', 'ok');
        setTimeout(function () { location.reload(); }, 500);
      } else {
        toast((res.data && res.data.msg) || 'Error al guardar', 'error');
      }
    } catch (err) {
      toast('Error de conexión', 'error');
    }
  }

  async function borrarActual() {
    if (!actual || !actual.id) return;
    var msgs = {
      empresa: '¿Ocultar esta empresa? (no se borra del todo)',
      sede: '¿Eliminar esta sede?',
      salon: '¿Eliminar este salón?',
      puesto: '¿Eliminar este puesto?'
    };
    if (!confirm(msgs[actual.tipo] || '¿Eliminar?')) return;
    try {
      var res = await api('/api/' + actual.tipo + '/' + actual.id, { method: 'DELETE' });
      if (res.ok) {
        toast(res.data.msg || 'Eliminado', 'ok');
        setTimeout(function () { location.reload(); }, 400);
      }
    } catch (err) {
      toast('Error de conexión', 'error');
    }
  }

  // Botones fijos
  document.getElementById('btnNuevaEmpresa').onclick = function () { abrirCrear('empresa'); };
  document.getElementById('btnCerrarPanel').onclick = cerrarPanel;
  document.getElementById('btnCancelar').onclick = cerrarPanel;
  document.getElementById('btnDelete').onclick = borrarActual;
  document.getElementById('crudForm').onsubmit = guardar;

  // Inicio
  renderTree();
})();
</script>
{% endblock %}
